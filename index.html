<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ratsada Rx Toolkit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f1f5f9; }
        .menu-card { transition: all 0.3s ease; border: 1px solid #e2e8f0; }
        .menu-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); border-color: #3b82f6; }
    </style>
</head>
<body class="p-6">
    <div class="max-w-md mx-auto">
        <header class="text-center mb-10 mt-4">
            <h1 class="text-3xl font-bold text-blue-600">Ratsada Rx</h1>
            <p class="text-slate-500">ระบบสนับสนุนการตัดสินใจทางคลินิก</p>
        </header>

        <div class="grid gap-4">
            <a href="crcl.html" class="menu-card bg-white p-5 rounded-2xl flex items-center gap-4">
                <div class="bg-blue-100 p-3 rounded-xl text-blue-600">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
                    </svg>
                </div>
                <div>
                    <h2 class="font-bold text-lg text-slate-800">CrCl Calculator</h2>
                    <p class="text-sm text-slate-500">คำนวณ Cockcroft-Gault</p>
                </div>
            </a>

            <a href="ibw.html" class="menu-card bg-white p-5 rounded-2xl flex items-center gap-4">
                <div class="bg-emerald-100 p-3 rounded-xl text-emerald-600">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                </div>
                <div>
                    <h2 class="font-bold text-lg text-slate-800">Pediatric IBW</h2>
                    <p class="text-sm text-slate-500">คำนวณน้ำหนักตัวอุดมคติในเด็ก</p>
                </div>
            </a>

            <a href="warfarin.html" class="menu-card bg-white p-5 rounded-2xl flex items-center gap-4">
                <div class="bg-rose-100 p-3 rounded-xl text-rose-600">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.628.282a2 2 0 01-1.998 0l-.628-.282a6 6 0 00-3.86-.517l-2.387.477a2 2 0 00-1.022.547l-.34.34a2 2 0 000 2.828l1.245 1.245A9.754 9.754 0 013 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75a9.754 9.754 0 01-1.015 4.316l1.245 1.245a2 2 0 002.828 0l-.34-.34z" />
                    </svg>
                </div>
                <div>
                    <h2 class="font-bold text-lg text-slate-800">Warfarin Dose</h2>
                    <p class="text-sm text-slate-500">จัดการขนาดยาตามค่า INR</p>
                </div>
            </a>

            <div class="p-5 border-2 border-dashed border-slate-300 rounded-2xl text-center">
                <p class="text-slate-400 text-sm italic">+ เครื่องมือใหม่ๆ ในอนาคต</p>
            </div>
        </div>

        <footer class="text-center mt-12">
            <p class="text-slate-400 text-xs uppercase tracking-widest font-semibold">ภก.วิจักขณ์ พลอินทร์</p>
            <p class="text-slate-400 text-[10px]">รพ.รัษฎา จ.ตรัง</p>
        </footer>
    </div>
</body>
</html>
