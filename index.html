<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ratsada Rx Toolkit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; overflow: hidden; }
        
        /* Sidebar Transitions */
        .sidebar { transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), transform 0.3s ease; }
        .sidebar-expanded { width: 260px; }
        .sidebar-collapsed { width: 80px; }
        
        /* Hide text when collapsed */
        .sidebar-collapsed .menu-text, 
        .sidebar-collapsed .sidebar-header-text,
        .sidebar-collapsed .footer-text { 
            display: none; 
        }
        
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); width: 260px !important; }
            .sidebar.mobile-active { transform: translateX(0); }
        }
        
        .overlay { display: none; }
        @media (max-width: 768px) {
            .overlay.active { display: block; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 30; }
        }
        
        iframe { width: 100%; height: calc(100vh - 64px); border: none; }
        .menu-item { transition: all 0.2s; display: flex; align-items: center; }
        .sidebar-collapsed .menu-item { justify-content: center; padding-left: 0; padding-right: 0; }
    </style>
</head>
<body class="bg-slate-50 flex">

    <div id="overlay" class="overlay" onclick="toggleMobileSidebar()"></div>

    <aside id="sidebar" class="sidebar sidebar-expanded fixed md:static inset-y-0 left-0 z-40 bg-white border-r border-slate-200 flex flex-col shadow-xl md:shadow-none">
        <div class="h-16 flex items-center px-6 border-b border-slate-100 overflow-hidden">
            <div class="min-w-[32px] h-8 w-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold text-xl">R</div>
            <div class="sidebar-header-text ml-3 overflow-hidden whitespace-nowrap">
                <h1 class="text-lg font-bold text-slate-800">Ratsada Rx</h1>
            </div>
        </div>
        
        <nav class="flex-1 p-3 space-y-2">
            <button onclick="loadPage('crcl.html', this, 'Kidney: CrCl')" class="menu-item w-full h-12 px-4 text-slate-600 rounded-xl hover:bg-blue-50 hover:text-blue-600">
                <div class="min-w-[24px]">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
                    </svg>
                </div>
                <span class="menu-text ml-3 font-medium whitespace-nowrap">Kidney: CrCl</span>
            </button>

            <button onclick="loadPage('ibw.html', this, 'Pediatric IBW')" class="menu-item w-full h-12 px-4 text-slate-600 rounded-xl hover:bg-emerald-50 hover:text-emerald-600">
                <div class="min-w-[24px]">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                </div>
                <span class="menu-text ml-3 font-medium whitespace-nowrap">Pediatric IBW</span>
            </button>

            <button onclick="loadPage('warfarin.html', this, 'Warfarin Dose')" class="menu-item w-full h-12 px-4 text-slate-600 rounded-xl hover:bg-rose-50 hover:text-rose-600">
                <div class="min-w-[24px]">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.628.282a2 2 0 01-1.998 0l-.628-.282a6 6 0 00-3.86-.517l-2.387.477a2 2 0 00-1.022.547l-.34.34a2 2 0 000 2.828l1.245 1.245A9.754 9.754 0 013 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75a9.754 9.754 0 01-1.015 4.316l1.245 1.245a2 2 0 002.828 0l-.34-.34z" />
                    </svg>
                </div>
                <span class="menu-text ml-3 font-medium whitespace-nowrap">Warfarin Dose</span>
            </button>
        </nav>

        <div class="p-4 border-t border-slate-100 bg-slate-50 overflow-hidden text-center">
            <p class="footer-text text-slate-400 text-[10px] uppercase font-bold">Dev By</p>
            <p class="text-blue-600 font-bold text-xs uppercase tracking-tighter">Jakky141</p>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-hidden">
        <header class="h-16 bg-white border-b border-slate-200 flex items-center px-4">
            <button onclick="handleNavToggle()" class="p-2 text-slate-600 hover:bg-slate-100 rounded-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>
            <div id="current-title" class="ml-4 font-semibold text-slate-700">หน้าแรก</div>
        </header>

        <div class="flex-1 relative overflow-hidden bg-white">
            <div id="welcome-screen" class="absolute inset-0 flex flex-col items-center justify-center p-6 text-center bg-slate-50">
                <h2 class="text-3xl font-bold text-slate-800 mb-2">ยินดีต้อนรับ</h2>
                <p class="text-slate-500 mb-8">พัฒนาโดย <span class="text-blue-600 font-bold">Jakky141</span></p>
                <p class="text-sm text-slate-400">เลือกเครื่องมือจากแถบเมนูเพื่อเริ่มคำนวณ</p>
            </div>
            <iframe id="tool-frame" class="hidden h-full w-full" src=""></iframe>
        </div>
    </main>

    <script>
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const frame = document.getElementById('tool-frame');
        const welcome = document.getElementById('welcome-screen');
        const titleDisplay = document.getElementById('current-title');

        // Logic for both Desktop and Mobile
        function handleNavToggle() {
            if (window.innerWidth >= 768) {
                // Desktop: Collapse/Expand
                sidebar.classList.toggle('sidebar-expanded');
                sidebar.classList.toggle('sidebar-collapsed');
            } else {
                // Mobile: Open/Close Drawer
                sidebar.classList.toggle('mobile-active');
                overlay.classList.toggle('active');
            }
        }

        function toggleMobileSidebar() {
            sidebar.classList.remove('mobile-active');
            overlay.classList.remove('active');
        }

        function loadPage(url, btn, title) {
            welcome.classList.add('hidden');
            frame.classList.remove('hidden');
            frame.src = url;
            titleDisplay.innerText = title;

            // Update UI Active State
            document.querySelectorAll('.menu-item').forEach(el => {
                el.classList.remove('bg-blue-600', 'text-white', 'hover:bg-blue-50');
                el.classList.add('text-slate-600');
            });
            
            btn.classList.remove('text-slate-600');
            btn.classList.add('bg-blue-600', 'text-white');

            // Close on Mobile
            if (window.innerWidth < 768) toggleMobileSidebar();
        }
    </script>
</body>
</html>
